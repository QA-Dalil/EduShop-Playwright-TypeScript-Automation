name: EduShop Playwright tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out test suite
        uses: actions/checkout@v4
      - name: Check out EduShop application
        uses: actions/checkout@v4
        with:
          repository: BayanAlhassoun/E-Commerce-test-project-for-API---JMeter---Automation
          path: edushop-app
      - name: Start EduShop
        working-directory: edushop-app
        run: docker compose up --build -d
      - name: Wait for services
        shell: bash
        run: |
          for attempt in {1..90}; do
            if curl --fail --silent http://localhost:5000/api/product > /dev/null && curl --fail --silent http://localhost:4200/ > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f edushop-app/docker-compose.yml logs
          exit 1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Typecheck
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Upload HTML report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edushop-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Print app logs on failure
        if: failure()
        run: docker compose -f edushop-app/docker-compose.yml logs --tail=200
      - name: Stop EduShop
        if: always()
        run: docker compose -f edushop-app/docker-compose.yml down -v
